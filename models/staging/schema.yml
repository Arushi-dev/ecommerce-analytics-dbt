version: 2

models:
  - name: stg_orders
    description: "Cleaned orders — excludes cancelled and unavailable"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customer records"
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order line items with calculated total value"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: item_price
        tests:
          - not_null

  - name: stg_products
    description: "Product catalogue with cleaned category names"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null